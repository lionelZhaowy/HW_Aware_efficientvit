data_provider:
  dataset: imagenet
  data_dir: /srv/datasets/ImageNet100
  rrc_config:
    train_interpolate: random
    test_interpolate: bicubic
    test_crop_ratio: 1.0
  data_aug:
    name: randaug
    n: 2
    m: 6
    name: erase
    p: 0.2
  base_batch_size: 512
  valid_size: 256
  n_worker: 16
  image_size:
  - 128
  - 160
  - 192
  - 224
  - 256
  drop_last: true

run_config:
  n_epochs: 800
  base_lr: 0.0005
  warmup_epochs: 20
  warmup_lr: 0.0
  lr_schedule_name: cosine
  lr_schedule_param: {}
  optimizer_name: adamw
  optimizer_params:
    eps: 1.0e-08
    betas:
    - 0.9
    - 0.999
  weight_decay: 0.05
  no_wd_keys:
  - norm
  - bias
  grad_clip: 2.0
  reset_bn: true
  reset_bn_size: 16000
  reset_bn_batch_size: 100
  eval_image_size:
  - 256
  label_smooth: 0.1
  mixup_config:
    op:
    - - mixup
      - 0.2
      - 1.0
    - - cutmix
      - 0.2
      - 1.0
  bce: true
  mesa: null

backbone_drop:
  name: droppath
  drop_prob: 0.05
  linear_decay: true

ema_decay: 0.9998
